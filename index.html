.eqchip{position:relative;flex:0 0 42px;height:42px;border:3px solid transparent;border-radius:999px;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.eqchip.on{border-color:#111;background:var(--card)}
.eqchip b{position:absolute;right:-1px;top:-1px;width:12px;height:12px;border-radius:50%;background:var(--ac);border:2px solid #fff}
@keyframes wipeAll{0%{transform:translate3d(-110%,0,0) skewX(-12deg)}45%,55%{transform:translate3d(0,0,0) skewX(-12deg)}100%{transform:translate3d(110%,0,0) skewX(-12deg)}}
@keyframes wipeIn{from{transform:translate3d(-110%,0,0) skewX(-12deg)}to{transform:translate3d(0,0,0) skewX(-12deg)}}
@keyframes wipeOut{from{transform:translate3d(0,0,0) skewX(-12deg)}to{transform:translate3d(110%,0,0) skewX(-12deg)}}
@keyframes scrFade{from{opacity:0}to{opacity:1}}
.wipe{position:fixed;top:0;bottom:0;left:-30%;width:160%;z-index:50;pointer-events:auto;background:linear-gradient(135deg,var(--pn2),var(--pn));will-change:transform;transform:translate3d(-110%,0,0) skewX(-12deg);animation:wipeAll .62s cubic-bezier(.45,0,.55,1) forwards}
.wipe.wi{animation:wipeIn .3s cubic-bezier(.5,0,.8,.6) forwards}
.wipe.wo{animation:wipeOut .34s cubic-bezier(.2,.6,.4,1) forwards}
.blk{position:fixed;inset:0;z-index:49}
#app.tr>svg,#app.tr>.rainwrap{animation:scrFade .45s ease-out .2s backwards;will-change:opacity}
@keyframes mvy{from{transform:translateY(var(--dy));opacity:.45}}
@keyframes mvx{from{transform:translateX(var(--dx))}}
@keyframes spawnIn{from{opacity:0;transform:scale(.6) translateY(-10px)}}
.mvy{animation:mvy .55s cubic-bezier(.2,.8,.2,1) backwards;position:relative;z-index:2}
.mvx{animation:mvx .4s cubic-bezier(.3,.7,.3,1) backwards;position:relative;z-index:2}
.spw{animation:spawnIn .4s ease-out .3s backwards}
.ghost{position:absolute;inset:0;margin:0;pointer-events:none;outline:none;z-index:4}
/* ===== 몰입감: 보스 연출, 분위기 ===== */
.bint{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#2a0a40 0,#06000d 70%);animation:bfade .5s ease both;overflow:hidden;cursor:pointer}
.bint.out{animation:bout .5s ease forwards}
@keyframes bfade{from{opacity:0}to{opacity:1}}
@keyframes bout{to{opacity:0}}
.bcrack{position:absolute;left:50%;top:-5%;width:6px;height:110%;margin-left:-3px;background:linear-gradient(#fff,#c9a0ff 40%,#fff);clip-path:polygon(40% 0,60% 10%,35% 22%,65% 36%,30% 50%,70% 64%,38% 78%,62% 90%,45% 100%,55% 100%,70% 90%,40% 76%,75% 62%,32% 48%,68% 34%,40% 20%,65% 8%,55% 0);box-shadow:0 0 30px 10px #a56bff;opacity:0;transform:scaleY(.1);animation:bcrk .9s .35s ease-out forwards}
@keyframes bcrk{0%{opacity:0;transform:scaleY(.1)}20%{opacity:1}100%{opacity:.85;transform:scale(14,1)}}
.bt{position:relative;display:flex;font-size:52px;font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 0 22px #b57bff,0 4px 0 #000;z-index:1}
.bt span{opacity:0;display:inline-block;animation:bchar .55s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes bchar{0%{opacity:0;transform:scale(2.4) translateY(-14px);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
.bs{position:relative;margin-top:14px;font-size:14px;letter-spacing:.35em;color:#d9c2ff;opacity:0;animation:bfade .8s 2.3s ease forwards;z-index:1}
.bsk{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);font-size:11px;color:#9a86bd;opacity:0;animation:bfade .6s 1.2s ease forwards}
@keyframes bshake{0%,100%{transform:none}10%{transform:translate(-7px,4px)}20%{transform:translate(6px,-5px)}30%{transform:translate(-5px,-3px)}40%{transform:translate(5px,4px)}50%{transform:translate(-3px,2px)}60%{transform:translate(3px,-2px)}80%{transform:translate(-1px,1px)}}
body.bshake #app{animation:bshake 1.3s .3s ease-out}
#atmo{position:fixed;top:0;bottom:0;left:50%;width:min(100%,520px);transform:translateX(-50%);z-index:2;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .7s}
#atmo.on{opacity:1}
#atmo::before,#atmo::after{content:"";position:absolute;inset:-20%}
@keyframes ffly{from{background-position:0 0,40px 50px}to{background-position:0 -110px,40px -90px}}
@keyframes fdown{from{background-position:0 0,40px 50px}to{background-position:0 110px,40px 160px}}
.snowL{position:absolute;inset:0;contain:paint;border-radius:22px;overflow:hidden;pointer-events:none;background:rgba(170,195,230,.16)}
.snowL::before,.snowL::after{content:"";position:absolute;left:0;right:0;bottom:0;background-repeat:repeat;will-change:transform;backface-visibility:hidden}
.snowL::before{background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.6px 1.6px at 90px 80px,rgba(255,255,255,.9),transparent),radial-gradient(2.2px 2.2px at 150px 140px,#fff,transparent),radial-gradient(1.4px 1.4px at 50px 170px,rgba(255,255,255,.85),transparent),radial-gradient(1.8px 1.8px at 180px 20px,rgba(255,255,255,.9),transparent);top:-200px;background-size:200px 200px;animation:snowA 11s linear infinite}
.snowL::after{background-image:radial-gradient(3.4px 3.4px at 40px 60px,#fff,transparent),radial-gradient(2.8px 2.8px at 200px 190px,rgba(255,255,255,.95),transparent),radial-gradient(3px 3px at 120px 250px,#fff,transparent),radial-gradient(3.6px 3.6px at 260px 110px,rgba(255,255,255,.9),transparent);top:-300px;background-size:300px 300px;animation:snowB 7s linear infinite}
@keyframes snowA{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,200px,0)}}
@keyframes snowB{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,300px,0)}}
@media (prefers-reduced-motion:reduce){.snowL{display:none}}
.rainwrap{position:relative}
.rainL{position:absolute;inset:0;border-radius:22px;overflow:hidden;pointer-events:none;background:rgba(8,20,50,.36)}

inn:["안전","여행자들의 숨결이 느껴지는 포켓몬센터다. 회복 기계가 경쾌한 멜로디를 울리고 식당에서 구수한 냄새가 난다. 오랜만에 제대로 쉬어갈 수 있을 것 같다.","푹 자고 일어나니 몸이 가볍다.","잠이 오지 않아 뒤척였다."],
lab:["위험","로켓단 비밀 연구소의 연구원이 주사기를 들고 환하게 웃는다. '강화 주사야! 부작용? 아주 조금뿐이지.' 눈 밑이 거뭇하다.","주사가 효과를 발휘했다. 눈빛이 날카로워졌다.","부작용이 나타났다. 몸이 휘청인다."],
thief:["도박","좁은 길목에서 로켓단 단원이 몬스터볼을 장난스럽게 돌린다. '구슬 주머니, 얌전히 내놔.' 맞설 수도, 던지고 달아날 수도 있다.","단원이 줄행랑을 쳤다. 전리품이 남았다!","단원이 한 수 위였다."],
bell:["도박","폐허가 된 방울탑 꼭대기에 낡은 종이 매달려 있다. 줄을 당기면 소리가 울리지만, 그 소리가 길한지 흉한지는 울려 봐야 안다.","종소리가 맑게 울려 퍼졌다. 발걸음이 가벼워졌다.","불길한 소리가 울렸다. 어쩐지 등골이 서늘하다."],
scale:["거래","낡은 저울을 짊어진 점술가가 어깨를 으쓱한다. '내 저울은 정직하지만, 기울이는 법도 알려 줄 수 있지. 구슬 5개, 어때?'","저울이 당신 쪽으로 슬며시 기울었다.","점술가는 저울을 접으며 돌아섰다."],
statue:["도박","고대 석상 앞에 문이 세 개 나란히 서 있다. 레지락, 레지아이스, 레지스틸의 얼굴이 새겨진 문. 길한 문은 오직 하나… 어쩌면 하나도 없을지도.","문 너머에서 따뜻한 빛이 흘러나왔다.","문 너머는 서늘하고 함정이 가득했다."],
coin:["안전","흙먼지 속에서 금빛이 반짝인다. 나옹이 모아 둔 듯한 동전 한 닢이다. 누가 떨어뜨렸을까, 아니면 미끼일까. 허리를 굽혀 볼 만하다.","진짜 부적금화였다! 햇빛에 반짝였다.","가짜 동전이었다. 손에 녹이 묻었다."],
picnic:["안전","풀밭에 누군가 끓여 둔 포켓몬 카레가 펼쳐져 있다. 아직 온기가 남아 있다. 주인은 보이지 않는다. 동료들이 조용히 군침을 삼킨다.","배불리 먹고 한결 든든해졌다.","주인이 돌아오기 전에 서둘러 자리를 떴다."],
scroll:["안전","낡은 두루마리를 펼치면 알 수 없는 문자가 빼곡하다. 진화의 비밀이 담긴 기록 같다. 읽을수록 머릿속이 환해진다.","문장이 몸에 스며들며 진화의 기운이 깊어졌다.","글자가 흐려져 더 읽을 수 없다."],
smith:["거래","망치 소리가 산길에 울린다. 불꽃 포켓몬과 함께 일하는 떠돌이 대장장이가 이마의 땀을 닦으며 말한다. '구슬 5개면 한 놈 제대로 벼려 주지.'","불꽃이 튀고 단련이 끝났다. 눈에 띄게 단단해졌다.","대장장이는 망치질을 이어 갔다."],
star:["안전","밤하늘을 가로지르는 별똥별 하나. 지라치가 깨어나는 밤일지도 모른다. 소원을 빌 시간은 아주 짧다. 눈을 감고 하나만 떠올려 보자.","별빛이 내려앉았다. 소원이 닿았다!","별은 말없이 사라졌다."],
stray:["도박","풀숲에서 작은 포켓몬이 따라온다. 주변을 맴돌며 눈치를 보는 모습이 안쓰럽다. 데려가면 식구가 늘지만 챙기느라 부담이 커진다.","새 동료가 꼬리를 흔들며 덱에 합류했다.","포켓몬은 아쉬운 듯 몇 번 돌아보며 멀어졌다."],
gem:["위험","검붉게 빛나는 어둠의 돌이 가시덤불 한가운데에 박혀 있다. 한눈에도 값비싸 보이지만, 주변의 공기가 이상하게 무겁다.","어둠의 돌의 빛이 손끝에서 일렁였다. 부자가 됐다.","어둠의 돌의 기운이 따라붙는다…"],
swap:["거래","메타몽의 변신 교환소 주인이 모자를 눌러쓰고 속삭인다. '구슬 2개만 내. 네 동료를 전혀 다른 아이로 바꿔 주지. 후회는… 네 몫이야.'","새로운 동료가 눈을 반짝이며 나타났다.","교환소 주인이 어깨를 으쓱했다."],
book:["안전","도서관 구석, 먼지 쌓인 훈련 교본을 발견했다. 페이지 사이사이에 손때가 묻어 있다. 읽으면 훈련으로 쌓인 피로를 풀 수 있을 것 같다.","페이지를 넘길수록 몸이 가벼워졌다.","교본의 글씨가 지워져 있다."],
shadow:["위험","안개 속에서 펜텀 포켓몬이 소리 없이 손짓한다. 따라가면 무언가를 얻을 수 있다. 하지만 돌아오지 못한 이들의 이야기도 많다.","펜텀이 고개를 끄덕이며 선물을 내밀었다.","펜텀이 소중한 것을 데려갔다…"],
dragon:["위험","절벽 위 둥지에 망나뇽의 알이 은은히 빛난다. 어미 망나뇽은 깊이 잠들어 있다. 발끝을 조심스레 디디면 닿을 수 있다. 숨소리 하나하나가 땅을 울린다.","알을 품에 안고 무사히 내려왔다. 전설이 곁에 있다!","어미 망나뇽이 눈을 떴다. 파괴광선을 피해 간신히 도망쳤다."],
duel:["위험","붉은 모자의 라이벌 트레이너가 길을 가로막는다. '네 아이와 내 포켓몬, 한 판 붙이자. 진 쪽이 상대에게 간다.' 그의 눈에는 자신감이 가득하다.","승리! 트레이너가 탄성을 내뱉으며 물러났다.","패배했다. 트레이너가 승자를 데려갔다."],
allin:["위험","게임코너 VIP룸, 코인이 산처럼 쌓여 있다. '가진 걸 전부 걸어야 진짜 승부지.' 딜러가 속삭인다. 이기면 세 배, 지면 빈털터리다.","잭팟! 칩이 산더미처럼 불어났다.","주머니가 텅 비었다. 딜러가 웃는다."],
pact:["위험","어둠이 발밑에서 일어나 다크라이의 형상을 취한다. '목숨 하나를 내놔. 부와 힘을 주지.' 목소리는 달콤하고 차갑다.","계약서에 피가 번졌다. 구슬과 힘이 쏟아졌다.","다크라이가 비웃으며 사라졌다."],
mirror:["위험","유령 저택 복도 끝, 일그러진 거울이 서 있다. 거울 속 당신의 동료들이 한 박자 늦게 움직인다. 비추면 하나가 더 생기지만 가끔은 거울이 삼켜 버린다.","거울 속에서 똑같은 동료가 걸어 나왔다!","거울이 소중한 것을 삼켰다."],
volcano:["위험","화산 분화구 가장자리에서 불꽃의 돌이 반짝인다. 용암이 부글거리고 불꽃 포켓몬들이 울부짖는다. 동료를 내려보내면 가져올 수 있지만 돌아오지 못할 수도 있다.","결정을 움켜쥐고 불길 속에서 돌아왔다!","불길이 삼켰다. 돌아오지 않는다."],
cursed:["위험","로켓단의 'R' 문양이 새겨진 비밀 금고. 열면 부와 저주가 한꺼번에 쏟아질 수 있다.","금빛이 쏟아졌다. 저주는 오지 않았다!","상자가 검은 연기를 내뿜었다. 저주가 퍼진다…"],
roulette:["도박","게임코너의 낡은 룰렛이 삐걱거리며 돌아간다. 여섯 칸 중 하나에 바늘이 멈춘다. 대박도, 쪽박도 가능하다. 구경꾼들이 숨을 죽인다.","바늘이 멈췄다. 행운의 칸!","바늘이 멈췄다. 불운의 칸…"],
blood:["위험","어둠의 제단 앞에서 광폭해진 포켓몬이 붉은 서약서를 내민다. '피로 맹세하라. 덱 전체가 힘을 얻으리라.' 대가는 목숨 하나다.","서약이 맺어졌다. 모든 동료의 눈이 붉게 빛났다.","서약은 맺어지지 못했다."],
dangersigil:["도박","무면허 각인사가 쇠도장을 불에 달구며 웃는다. '두 개 한꺼번에 새겨 주지! 실패하면… 뭐, 그건 그때 가서.' 구슬 3개가 필요하다.","두 개의 도장이 한꺼번에 새겨졌다!","각인이 어긋났다. 상처가 남았다."],
fusion:["위험","금단의 DNA 융합 장치가 증기를 뿜는다. 두 포켓몬을 넣으면 전혀 다른 전설이 태어난다고 한다. 되돌릴 수는 없다.","장치가 굉음을 내며 새 카드를 뱉어냈다!","장치가 멈췄다. 아무 일도 일어나지 않았다."],
legend:["위험","하늘이 갈라지고 전설의 기운이 내려온다. 카드 세 장을 제물로 바치면 전설이 응답한다. 구름이 소용돌이친다.","전설이 응답했다. 빛이 쏟아졌다!","기운은 허공으로 흩어졌다."],
thunder:["도박","검은 구름이 하늘을 덮고 썬더의 울음소리가 천둥처럼 울린다. 동료를 피뢰침 삼아 번개를 받게 하면 강해질 수 있지만, 어떤 일이 벌어질지는 아무도 모른다.","번개가 내리꽂혔다! 몸에서 전기가 일렁인다.","번개에 그슬렸다. 연기가 피어오른다."],
bomb:["도박","째깍째깍. 마그마단이 설치한 폭탄 상자의 타이머가 줄어든다. 빨간 선과 파란 선, 어느 쪽을 자를 것인가. 식은땀이 흐른다.","타이머가 멈췄다. 해체 성공!","콰앙! 폭발에 휘말렸다."],
fate:["도박","금빛 부적금화를 엄지에 얹는다. 하늘 높이 튕겨 올리면 앞면이냐 뒷면이냐로 운명이 갈린다. 부적금화는 귀한 물건이다.","앞면! 동전이 세 배로 불어났다.","뒷면… 동전이 허공으로 사라졌다."],
wish:["도박","낡은 램프를 문지르자 연기가 피어오르고 램프라가 나타난다. '큰 소원 하나, 들어주마. 단, 나는 변덕스럽거든?' 램프라가 윙크한다.","램프라가 불꽃을 튕기자 소원이 이루어졌다!","램프라가 장난스럽게 웃으며 사라졌다."],
giant:["위험","산만 한 그림자가 길을 가로막는다. 거대한 포켓몬이 팔을 걷어붙이며 힘겨루기를 청한다. 공격이 강한 카드일수록 승산이 있다.","거대한 포켓몬이 쿵 하고 무릎을 꿇었다. 승리!","거대한 포켓몬이 가볍게 팔을 휘둘렀다. 패배했다."],
swamp:["도박","독 포켓몬이 사는 늪, 독기가 안개처럼 피어오른다. 늪 너머로 보물 상자가 보인다. 건너는 동안 독기가 스며들 수 있다. 건너편까지 겨우 몇 걸음이다.","늪을 건너 보물을 움켜쥐었다!","독기가 온몸에 스며들었다…"],
mask:["도박","그림자 속에서 오거폰 가면 상인이 가면을 하나씩 꺼낸다. '이게 바로 전설의 가면이야! 구슬 5개면 가져가도 좋아.' 가면은 의심스럽게 번쩍인다.","가면이 진짜였다! 전설의 기운이 흘러나온다.","가면은 가짜였다. 상인이 낄낄댄다."],
trial:["위험","불길이 일렁이는 시련의 문 앞을 불꽃 포켓몬이 지키고 있다. 통과한 자만이 성장한다고 전해진다. 하지만 돌아오지 못한 포켓몬도 많다.","불길을 통과해 한층 강해졌다!","불길이 삼켰다. 돌아오지 않는다…"],
nfountain:["안전","숲 속 빈터에 맑은 샘이 솟아 있다. 바닥에는 누군가 던진 동전이 반짝인다. 소원을 빌면 이루어진다는 소문이 있다.","샘이 푸르게 빛났다.","샘은 잠잠했다."],
nbeggar:["거래","길가에 앉은 노인이 빈 그릇을 내밀고 있다. 눈빛은 흐리지만 어딘가 범상치 않다. '구슬 두 개만 적선하게나.'","노인이 미소 지으며 보답했다.","노인은 고개를 숙인 채 말이 없었다."],
ntrain:["도박","나무에 매달린 낡은 샌드백이 흔들리고 있다. 단련하면 강해질 수 있지만, 낡은 물건이라 무엇이 터질지 모른다.","샌드백이 묵직한 소리를 냈다.","샌드백이 터졌다."],
nrain:["안전","잿빛 구름이 몰려오더니 굵은 빗방울이 쏟아진다. 쉬어 갈까, 아니면 비를 뚫고 서둘러 갈까.","비가 그쳤다.","비는 오래도록 내렸다."],
ncave:["위험","발밑이 갈라지며 깊은 틈이 입을 벌렸다. 아래에서 희미한 빛이 새어 나온다. 내려가면 무언가를 얻을 수 있겠지만, 돌아오지 못할 수도 있다.","틈 속에서 보물을 찾았다.","틈이 무너졌다."],
nmerchant:["거래","등에 산더미만 한 보따리를 진 행상이 길을 막는다. '좋은 물건이 있어요. 아주 좋은 물건이.' 눈이 의심스럽게 번뜩인다.","거래가 성사됐다.","행상은 아쉬운 듯 돌아섰다."],
nrival:["도박","어딘가 낯익은 트레이너가 길을 막아선다. '내 덱이 더 강하다는 걸 증명해 주지.' 이기면 전리품을, 지면 자존심을 잃는다.","라이벌이 고개를 숙였다.","라이벌의 웃음소리가 길게 울렸다."],
nlighthouse:["거래","파도 너머 오래된 등대가 서 있다. 등대지기가 '불을 밝히는 데 구슬이 필요하다'며 손짓한다. 조각배도 한 척 매여 있다.","등대 불이 바다를 비췄다.","배가 크게 흔들렸다."],
nwhirl:["위험","바다 한가운데 거대한 소용돌이가 돌고 있다. 정면으로 가로지르면 빠르지만 어떤 일이 벌어질지 알 수 없다.","물살이 몸을 단련시켰다.","물살이 무엇인가를 삼켰다."],
ncrystal:["도박","어둠 속에서 푸른 수정이 은은하게 빛난다. 캐면 보물이 나올 수도 있지만 굴이 무너질지도 모른다.","수정이 힘을 나눠 주었다.","수정 굴이 흔들렸다."],

function pvStrike(side,a,i,zone,arr){var opp=PV.cp[1-side],F=PV.F,acted=false;
var idx=(hs(a,"triple")?[i-1,i,i+1]:hs(a,"double")?[i-1,i+1]:[i]).filter(function(j){return j>=0&&j<4});
var ipn=ip(zone==="f"?opp[i]:(F[i]&&F[i].o!==side?F[i]:null));
for(var q=0;q<idx.length;q++){var j=idx[q],pw=Math.max(0,a.atk+(a.held==="orb"?2:0)-ipn);
if(zone==="f"){var d=opp[j];if(d&&hs(d,"water"))d=null;var fl=hs(a,"fly")||a.held==="balloon";acted=true;
if(d&&(!fl||hs(d,"hunter")))pvDmg(side,a,d,opp,j,pw+(hs(a,"hunter")&&hs(d,"fly")?2:0),hs(a,"venom")&&!hs(d,"steel"));else PV.s+=side?-pw:pw}
else{var t=F[j];if(!t||t.o===side||hs(t,"water"))continue;acted=true;pvDmg(side,a,t,F,j,pw+(hs(a,"hunter")&&hs(t,"fly")?2:0),hs(a,"venom")&&!hs(t,"steel"))}
if(a.hp<=0)break}
if(acted&&a.hp>0&&a.held==="orb"){a.hp-=1;surv(a)}
if(a.hp<=0){PV.will[side]++;if(hs(a,"infinite"))pvRet(side,a);arr[i]=null}else if(acted)eat(a)}

for(var i=0;i<4;i++){var a=F[i];if(a&&a.o===side&&a.atk>0)pvStrike(side,a,i,"f",F);
a=cp[i];if(a&&a.atk>0)pvStrike(side,a,i,"c",cp)}}
function pvSprintF(side){var F=PV.F,done=[];for(var i=0;i<4;i++){var c=F[i];if(!c||c.o!==side||!hs(c,"sprint")||done.indexOf(c)>=0)continue;var d=c.dir||1,n=i+d;if(n<0||n>3||F[n]){d=-d;n=i+d}if(n>=0&&n<=3&&!F[n]){F[n]=c;F[i]=null;done.push(c)}c.dir=d}}

mine.forEach(function(c){if(c.held==="food")c.hp=Math.min(c.mhp,c.hp+1);delete c.mv});

PV.log="라운드 종료 · 의지 P1 "+w[0]+" : P2 "+w[1]+" → "+(w[0]===w[1]?"동률, 이전 선공 P"+(nf+1)+" 유지":"P"+(nf+1)+" 선공");

else return}

pvPush()}

if(!(PVN.conn&&PVN.conn.open))h+="<div class=log>🔴 상대와 연결이 끊겼습니다. 재접속을 기다리는 중…</div>";
if(PVL.sel!==null&&v.hand[PVL.sel]){var sc=C[v.hand[PVL.sel]];h+="<div class=log>"+sc.n+": 🩸"+sc.b+" 필요 (희생 "+pvSacVal()+"/"+sc.b+") · 진영·전장의 내 카드를 탭해 희생"+(gl(v.hand[PVL.sel]).length?" · "+gl(v.hand[PVL.sel]).map(function(x){return SG[x]+": "+SGD[x]}).join(" / "):"")+"</div>"}
if(v.over!==null){h+="<h2>"+(v.over===sd?"🏆 우승! 플레이어 대결 승리":"💀 패배… 상대가 우승")+"</h2><button class=btn onclick='newGame()'>🔄 새 게임</button>";return h}
h+="<div class=hand>"+v.hand.map(function(id,i){return hcard(id,i,PVL.sel===i,"pvTapHand")}).join("")+"</div>";
if(!mine)h+="<div class=log>⏳ 상대의 차례입니다…</div>";
else if(!v.drawn)h+="<div class=two><button class='btn alt' onclick='pvDraw()'>덱에서 뽑기 ("+v.mc[sd]+")</button><button class='btn alt' onclick='pvSq()'>잉어킹 ("+v.sq[sd]+")</button></div>";
else h+="<button class=btn onclick='pvEndT()'>⚔️ 턴 종료 (공격)</button>";
return h}
function pvHtml(){if(S.mp)pvProg();var st=PVN.stage,h="",msg=PVN.msg?"<div class=log>"+PVN.msg+"</div>":"";
if(S.phase==="pvgate"){
if(PVV)return pvBoard();
if(S.pvRes)return "<h2>"+(S.pvRes.win?"🏆 우승!":"💀 패배…")+"</h2><div class=log>"+(S.pvRes.why==="out"?"상대가 탈락해 부전승으로 우승했습니다.":S.pvRes.win?"플레이어 대결에서 승리했습니다.":"플레이어 대결에서 패배했습니다.")+"</div><button class=btn onclick='newGame()'>🔄 새 게임</button>";
return "<h2>⚔️ 플레이어 대결</h2><div class=log>덱 정비를 마쳤습니다. 상대가 3페이즈를 마치면 같은 보드에서 대결이 시작됩니다.</div>"+pvBadge()+"<div class=log>이 대결의 승자가 최종 우승자입니다.</div>"}
h+="<h2>🃏 덱몬</h2>";
if(st==="hostwait"){h+="<div class=log>상대에게 방 코드를 알려주세요.</div>"+(PVN.code&&!PVN.msg?"<div class=pvcode>"+PVN.code+"</div>":"")+msg+
"<div class=log>"+(PVN.guest?"✅ 상대가 접속했습니다!":PVN.seen?"상대의 접속 시도를 감지했습니다… 연결 중":"상대가 접속하길 기다리는 중…")+"</div>"+
"<button class=btn "+(PVN.guest?"":"disabled")+" onclick='pvBeginRun()'>▶ 멀티플레이 시작</button><button class='btn alt' onclick='pvLeave();render()'>취소</button>";return h}
if(st==="join"){h+="<div class=log>상대가 알려준 5자리 방 코드를 입력하세요.</div><input class=pvin maxlength=5 autocapitalize=characters autocomplete=off value='"+PVN.inp+"' oninput='pvInp(this)'>"+msg+
"<button class=btn onclick='pvJoin()'>🔗 접속</button><button class='btn alt' onclick='pvLeave();render()'>뒤로</button>";return h}
if(st==="guestwait"){h+="<div class=log>✅ 연결되었습니다. 방장이 시작하길 기다리는 중…</div><button class='btn alt' onclick='pvLeave();render()'>나가기</button>";return h}
h+="<div class=two style='margin:6px 0'><button class='btn"+((S.gen||1)===1?"":" alt")+"' style='margin:0' onclick='setGen(1)'>"+((S.gen||1)===1?"✔ ":"")+"1세대</button><button class='btn"+(S.gen===2?"":" alt")+"' style='margin:0' onclick='setGen(2)'>"+(S.gen===2?"✔ ":"")+"2세대</button></div><div class=log>멀티플레이: 각자 3페이즈를 따로 돌파한 뒤, 같은 보드에서 플레이어 대결을 합니다. 대결의 승자가 우승합니다.</div>"+msg+
"<button class=btn onclick='pvHost()'>🌐 멀티플레이 · 방 만들기</button><button class=btn onclick='pvJoinUi()'>🔗 멀티플레이 · 방 참가</button><button class='btn alt' onclick='pvSolo()'>🧍 싱글 플레이</button><button class='btn alt' onclick='pvHard()'>🔥 하드 모드 (싱글)</button><button class='btn alt' onclick='dexOpen()'>📖 도감 (✨ "+dexCnt(0)+"/"+dexIds(0).length+")</button>";return h}

function _bs(k){var i=typeof k==="string"?k.indexOf("~"):-1;return i>0?k.slice(0,i):k}
function _px(o){return new Proxy(o,{get:function(t,k){if(typeof k==="string"&&!(k in t)){var i=k.indexOf("~");if(i>0)return t[k.slice(0,i)]}return t[k]}})}
C=_px(C);EVO=_px(EVO);EVD=_px(EVD);IMG=_px(IMG);
var SV=load();if(SV){S=SV;applyGen();if(S.map&&S.map.length!==FL){genMap();S.mlog="맵이 길어져서 새로 그려졌습니다."}render()}else newGame();
if(S&&S.mp)pvResume();
